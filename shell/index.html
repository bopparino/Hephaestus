<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hephaestus</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="rail">
      <div class="wordmark">Hephaestus</div>

      <button class="nav-row" id="cmd-new"><span>New chat</span><span class="kbd">⌘N</span></button>
      <button class="nav-row" id="cmd-search"><span>Search</span><span class="kbd">⌘K</span></button>

      <button id="switcher" class="switcher">
        <span class="switcher__label">PROJECT</span>
        <span class="switcher__name" id="switcher-name">all</span>
        <span class="switcher__caret">▾</span>
      </button>
      <div id="switcher-menu" class="hidden"></div>

      <nav id="rail-nav"></nav>

      <div class="rail__spacer"></div>

      <footer class="rail__footer">
        <button class="nav-row" data-view="artifacts"><span>Artifacts</span><span class="nav-row__count" id="count-artifacts"></span></button>
        <button class="nav-row" data-view="memory"><span>Memory</span><span class="nav-row__count" id="count-memory"></span></button>
        <button class="nav-row" data-view="settings"><span>Settings</span></button>
        <select id="skin-select" title="skin"></select>
        <div class="rail__status"><span id="conn">linking…</span><span>beta</span></div>
      </footer>
    </aside>

    <main id="pane">
      <div class="toolbar">
        <button id="rail-toggle" title="toggle rail">☰</button>
        <span class="toolbar__crumb" id="crumb">new chat</span>
        <span class="toolbar__sep hidden" id="crumb-sep">/</span>
        <span class="toolbar__title" id="crumb-title"></span>
        <span class="toolbar__spring"></span>
        <span class="toolbar__meta" id="meta-mode">chat</span>
        <span class="toolbar__rule"></span>
        <span class="toolbar__meta" id="meta-usage">0 calls · 0 tok</span>
        <button id="inspector-toggle" title="toggle inspector">▤</button>
      </div>

      <section id="view"></section>

      <div id="dock">
        <div class="composer" id="composer">
          <div class="composer__scope hidden" id="scope-strip"></div>
          <textarea class="composer__field" id="input" rows="1" placeholder="Describe the work…" spellcheck="false"></textarea>
          <div class="composer__bar">
            <button class="iconbtn" id="attach" title="attach images or files">+</button>
            <button class="iconbtn iconbtn--mono" id="at-btn" title="scope with @">@</button>
            <span class="bar-rule"></span>
            <div class="mode" id="mode">
              <button class="mode__seg" id="plan-toggle" aria-pressed="false" title="plan mode — read and think, change nothing">plan</button>
              <button id="perm-btn" title="permission mode — ask: everything asks · auto: writes flow, commands ask · bypass: everything flows (hardline blocks always)">ask</button>
            </div>
            <span class="composer__spring"></span>
            <button class="modelbtn" id="model-btn"><span id="model-name">—</span><span class="modelbtn__caret">▾</span></button>
            <button class="send" id="send" disabled>Send</button>
          </div>
        </div>
        <div id="at-popup" class="hidden"></div>
        <div id="model-popup" class="hidden"></div>
        <input id="file-input" type="file" multiple accept="image/*,.txt,.md,.js,.ts,.py,.json,.yaml,.toml,.css,.html,.sh,.log" class="hidden">
      </div>
    </main>

    <aside id="inspector">
      <div class="inspector__head" id="inspector-head">THIS CHAT</div>
      <div id="inspector-body"></div>
    </aside>
  </div>

  <div id="overlay" class="hidden">
    <div id="search-box" class="hidden">
      <input id="search-input" type="text" placeholder="Search the transcripts…" autocomplete="off" spellcheck="false">
      <div id="search-results"></div>
    </div>
    <div id="approval-modal" class="hidden">
      <div class="modal__title">APPROVAL NEEDED</div>
      <div class="modal__tool" id="approval-tool"></div>
      <pre id="approval-summary"></pre>
      <div class="modal__actions">
        <button data-decision="allow-once">Once</button>
        <button data-decision="allow-session">Session</button>
        <button data-decision="allow-always">Always</button>
        <button data-decision="deny" class="deny">Deny</button>
      </div>
    </div>
    <div id="project-modal" class="hidden">
      <div class="modal__title modal__title--calm">NEW PROJECT</div>
      <div class="set-row"><label>Name</label><input id="pm-name" placeholder="kebab-case, e.g. forge-site" autocomplete="off"></div>
      <div class="set-row" style="align-items:flex-start"><label style="padding-top:8px">Folder</label>
        <div style="flex:1;min-width:0">
          <div id="pm-path" class="pm-path"></div>
          <div id="pm-dirs" class="dirlist"></div>
          <div class="keyfield" style="margin-top:8px">
            <input id="pm-newdir" placeholder="new folder name (optional)" autocomplete="off">
            <button id="pm-mkdir">Create folder</button>
          </div>
        </div>
      </div>
      <div class="modal__actions">
        <button id="pm-cancel">Cancel</button>
        <button id="pm-create" class="primary">Create project</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
