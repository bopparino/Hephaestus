name: release

# Tag a version (v0.3.0) and this builds the desktop wrapper for every
# platform: dmg (macOS arm + intel), nsis installer (Windows), deb +
# AppImage (Linux). Arch installs from packaging/arch/PKGBUILD (AUR-style).
# The engine ships via npm / install.sh — these artifacts are the glass.

on:
  push:
    tags: ['v*']

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # apple silicon
            args: ''
          - platform: macos-13            # intel
            args: ''
          - platform: ubuntu-22.04        # deb + AppImage
            args: ''
          - platform: windows-latest      # nsis
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: linux webview deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: build and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Hephaestus ${{ github.ref_name }}'
          releaseBody: 'The glass. Engine: `curl -fsSL https://raw.githubusercontent.com/bopparino/Hephaestus/main/install.sh | sh`'
          releaseDraft: true
          args: ${{ matrix.args }}
